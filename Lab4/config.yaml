# Lab 4 pipeline configuration (stored together with the processed-data hash)
seed: 42
dataset:
  openml_name: adult
  openml_version: 2
  expected_rows: 48842
  expected_columns: 15
  target: income
split:
  test_size: 0.30
  stratify: true
cleaning:
  numeric_imputer: median
  categorical_imputer: most_frequent
  clip_percentiles: [0.01, 0.99]
  drop_duplicates_train_only: true
  missing_token: "?"
features:
  derived: [capital_net, hours_per_age]
model:
  type: LogisticRegression
  max_iter: 1000
label_audit:
  sample_size: 50
paths:
  processed_dir: ../data/processed
  results_dir: results
